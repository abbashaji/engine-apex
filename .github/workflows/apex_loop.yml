name: Apex Autonomous Engine

on:
  push:
    paths:
      - 'problem.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai duckduckgo-search chromadb

      - name: Run Apex Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python engine_apex.py

      - name: Commit Blueprint & Vector Memory
        run: |
          git config --global user.name "Apex Engine"
          git config --global user.email "engine@apex.ai"
          git add APEX_BLUEPRINT.md .vector_memory/ || true
          git diff-index --quiet HEAD || git commit -m "chore(apex): update blueprint and latent memory [skip ci]"
          git push
