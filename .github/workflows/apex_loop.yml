name: Engine Apex Loop

on:
  push:
    paths:
      - 'problem.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai chromadb duckduckgo-search matplotlib numpy scipy

      - name: Run Apex Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python engine_apex.py

      - name: Commit and Push Evolution Artifacts
        run: |
          git config --global user.name "Apex Engine"
          git config --global user.email "apex-engine@users.noreply.github.com"
          git add APEX_BLUEPRINT.md .vector_memory/
          git diff --staged --quiet || git commit -m "chore(apex): update blueprint and latent memory [skip ci]"
          git push
