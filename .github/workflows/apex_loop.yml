name: Apex Autonomous Cognitive Loop

on:
  push:
    paths:
      - "problem.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-apex-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai chromadb duckduckgo-search numpy scipy sympy

      - name: Run Apex Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python engine_apex.py

      - name: Commit and push report and memory
        run: |
          git config --global user.name "Apex Engine"
          git config --global user.email "apex-bot@github.com"
          git add APEX_BLUEPRINT.md .vector_memory/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-evolved Apex Blueprint [skip ci]" && git push)
