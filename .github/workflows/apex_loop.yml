name: Apex Autonomous Cognitive Loop

on:
  push:
paths:
- 'problem.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-apex-system:
runs-on: ubuntu-latest

steps:
- name: دریافت آخرین کدهای ریپازیتوری
uses: actions/checkout@v4

- name: راه‌اندازی پایتون
uses: actions/setup-python@v5
with:
python-version: '3.10'

- name: نصب موتور محاسباتی، برداری و وب
run: |
pip install google-generativeai chromadb duckduckgo_search numpy scipy sympy

- name: اجرای حلقه تکاملی استنتاج
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
GITHUB_RUN_ID: ${{ github.run_id }}
run: |
python engine_apex.py

- name: کامیت گزارش نهایی و همگام‌سازی حافظه برداری
run: |
git config --global user.name "Apex Engine"
git config --global user.email "apex-bot@github.com"
git add APEX_BLUEPRINT.md .vector_memory/ || true
git commit -m "Auto-evolved Apex Blueprint [run-${{ github.run_id }}] [skip ci]" || exit 0
git push
